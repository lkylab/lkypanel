{% extends "base_admin.html" %}
{% load static %}

{% block title %}Email Settings — W3Panel{% endblock %}
{% block page_title %}Email Settings{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto space-y-6">
    <div>
        <h2 class="text-lg font-bold text-gray-900">Email Configuration</h2>
        <p class="text-xs text-gray-500">Configure global mail server parameters and spam mitigation</p>
    </div>

    <div class="bg-white rounded-xl border border-gray-200 p-6 shadow-sm">
        <form method="post" class="space-y-5">
            {% csrf_token %}
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-700">Submission SMTP Port</label>
                <input type="text" name="smtp_port" value="{{ smtp_port }}" class="mt-1.5 w-full rounded-lg border border-gray-300 px-3.5 py-2.5 text-sm text-gray-900 outline-none focus:border-blue-600">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-700">Spam Filter Engine</label>
                <select name="spam_filter" class="mt-1.5 w-full rounded-lg border border-gray-300 px-3.5 py-2.5 text-sm text-gray-900 bg-white outline-none focus:border-blue-600">
                    <option value="rspamd" {% if spam_filter == 'rspamd' %}selected{% endif %}>Rspamd (Recommended - Fast & Lightweight)</option>
                    <option value="spamassassin" {% if spam_filter == 'spamassassin' %}selected{% endif %}>SpamAssassin</option>
                    <option value="none" {% if spam_filter == 'none' %}selected{% endif %}>Disabled</option>
                </select>
            </div>

            <div class="flex items-center gap-3 pt-2">
                <input type="checkbox" id="dkim_enabled" name="dkim_enabled" {% if dkim_enabled %}checked{% endif %} class="size-4 rounded text-blue-600 focus:ring-blue-500 border-gray-300">
                <label for="dkim_enabled" class="text-sm font-medium text-gray-700">Automatically sign outbound emails with DKIM keys</label>
            </div>

            <div class="pt-4 border-t border-gray-100 flex justify-end">
                <button type="submit" class="inline-flex items-center gap-1.5 px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-semibold shadow-sm transition">
                    <i class="ti ti-check"></i> Save Email Settings
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
