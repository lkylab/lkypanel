{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>{% block title %}W3Panel{% endblock %} — W3Panel</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web@2.0.3"></script>
    
    <!-- Theme CSS -->
    <link rel="stylesheet" href="{% static 'css/theme.css' %}">

    <script>
    (function() {
        var stored = localStorage.getItem('w3panel-theme');
        var theme = stored;
        if (theme !== 'light' && theme !== 'dark') {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                theme = 'dark';
            } else {
                theme = 'light';
            }
            localStorage.setItem('w3panel-theme', theme);
        }
        var root = document.documentElement;
        root.classList.remove('dark', 'light');
        root.classList.add(theme);
    })();
    </script>

    {% block extra_css %}{% endblock %}
</head>
<body>
    {% block body %}{% endblock %}
    
    <!-- JavaScript -->
    <script>
        // Sync UI for theme state
        function updateThemeUI(theme) {
            var isDark = (theme === 'dark');
            var root = document.documentElement;
            root.classList.remove('dark', 'light');
            root.classList.add(theme);
            
            document.querySelectorAll('.theme-toggle-btn, .theme-toggle').forEach(function(btn) {
                btn.setAttribute('title', isDark ? 'Switch to light theme' : 'Switch to dark theme');
                var icon = btn.querySelector('i');
                if (icon) {
                    icon.className = isDark ? 'ti ti-sun text-base' : 'ti ti-moon text-base';
                }
            });

            var loginWrapper = document.getElementById('loginWrapper');
            if (loginWrapper) {
                loginWrapper.classList.remove('login-theme-dark', 'login-theme-light');
                loginWrapper.classList.add('login-theme-' + theme);
            }
            var themeIcon = document.getElementById('themeIcon');
            if (themeIcon) {
                themeIcon.className = isDark ? 'ti ti-sun text-lg' : 'ti ti-moon text-lg';
            }
        }

        // Theme toggle
        function toggleTheme() {
            var current = localStorage.getItem('w3panel-theme') || (document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            var next = (current === 'dark') ? 'light' : 'dark';
            localStorage.setItem('w3panel-theme', next);
            updateThemeUI(next);
        }

        // Initialize toggle button icons on load
        document.addEventListener('DOMContentLoaded', function() {
            var current = localStorage.getItem('w3panel-theme') || (document.documentElement.classList.contains('dark') ? 'dark' : 'light');
            updateThemeUI(current);
        });

        // Sidebar toggle
        function toggleSidebar() {
            const sidebar = document.querySelector('.sidebar');
            sidebar.classList.toggle('open');
        }
        
        // Modal functions
        function openModal(id) {
            document.getElementById(id).classList.add('active');
        }
        
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }
        
        // Close modal on overlay click
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) {
                    overlay.classList.remove('active');
                }
            });
        });
    </script>
    
    {% block extra_js %}{% endblock %}
</body>
</html>
